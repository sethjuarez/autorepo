[package]
name = "autorepo-desktop"
version = "0.10.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/sethjuarez/autorepo"
description = "Tauri desktop UI driver for autorepo."
publish = false

[lib]
name = "autorepo_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.4.1", features = [] }

[dependencies]
anyhow = { workspace = true }
autorepo = { path = "../../cli" }
autorepo-observation = { path = "../../../crates/autorepo-observation" }
serde = { workspace = true }
serde_json = { workspace = true }
tauri = { version = "2.8.5", features = ["image-png"] }
tauri-plugin-auditaur = "0.4.7"
tauri-plugin-dialog = "2.7.3"
tauri-plugin-single-instance = "2.0.0"
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
ureq = { version = "2.12.1", default-features = false, features = ["json", "tls"] }
