[package]
name = "autorepo"
version = "0.10.0"
edition = "2024"
description = "Prepare GitHub repositories for demos, workshops, and agent workflows from explicit packs."
license = "MIT"
repository = "https://github.com/sethjuarez/autorepo"
readme = "README.md"
keywords = ["github", "cli", "demo", "automation"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
anyhow = "1.0.99"
base64 = "0.22.1"
chrono = { version = "0.4.42", default-features = false, features = ["clock"] }
clap = { version = "4.5.47", features = ["derive"] }
comfy-table = "7.1.4"
globset = "0.4.15"
reqwest = { version = "0.12.23", default-features = false, features = ["json", "rustls-tls"] }
rusqlite = { version = "0.32.1", features = ["bundled"] }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.143"
serde_yaml = "0.9.34"
tempfile = "3.21.0"
thiserror = "2.0.16"
tokio = { version = "1.47.1", features = ["macros", "rt-multi-thread"] }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.20", features = ["env-filter"] }
urlencoding = "2.1.3"
uuid = { version = "1.18.1", features = ["v4"] }

[dev-dependencies]
insta = "1.43.1"
