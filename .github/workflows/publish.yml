name: Publish

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish to crates.io instead of running a dry-run.
        required: true
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  dry-run:
    name: Cargo publish dry-run
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Cargo publish dry-run
        if: inputs.publish == false
        run: cargo publish --dry-run

  publish:
    name: Cargo publish
    runs-on: ubuntu-latest
    if: inputs.publish == true
    environment: crates-io
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Publish to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          if [ -z "$CARGO_REGISTRY_TOKEN" ]; then
            echo "CARGO_REGISTRY_TOKEN secret is required for token-based publishing." >&2
            exit 1
          fi

          cargo publish
