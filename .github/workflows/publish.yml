name: Publish

on:
  pull_request:
    paths:
      - Cargo.lock
      - Cargo.toml
      - README.md
      - src/**
      - packs/**
      - .github/workflows/publish.yml
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      publish:
        description: Publish to crates.io instead of running a dry-run.
        required: true
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  publish:
    name: Cargo publish
    runs-on: ubuntu-latest
    environment: crates-io
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Cargo publish dry-run
        if: github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && inputs.publish == false)
        run: cargo publish --dry-run
      - name: Publish to crates.io
        if: github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.publish == true)
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          if [ -z "$CARGO_REGISTRY_TOKEN" ]; then
            echo "CARGO_REGISTRY_TOKEN secret is required for token-based publishing." >&2
            exit 1
          fi

          cargo publish
