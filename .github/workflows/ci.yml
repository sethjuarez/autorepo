name: CI

on:
  pull_request:
    paths-ignore:
      - CHANGELOG.md
      - Cargo.lock
      - Cargo.toml
      - package-lock.json
      - package.json
      - .release-please-manifest.json
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rust:
    name: Rust quality gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Tauri Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev libpipewire-0.3-dev librsvg2-dev patchelf
      - uses: dtolnay/rust-toolchain@stable
      - name: cargo fmt
        run: cargo fmt --check
      - name: cargo clippy
        run: cargo clippy --workspace -- -D warnings
      - name: cargo test
        run: cargo test --workspace
      - name: validate builtin pack
        run: cargo run --quiet -- validate builtin
      - name: deterministic dry-run
        run: cargo run --quiet -- prepare sethjuarez/autorepo-test-dry-run --pack builtin --dry-run
      - name: warm smoke
        run: cargo run --quiet -- warm sethjuarez/autorepo-test-dry-run --pack builtin --only facilitator_session,open_repo

  desktop:
    name: Desktop quality gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Tauri Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev libpipewire-0.3-dev librsvg2-dev patchelf
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - name: Install frontend dependencies
        run: npm ci
      - name: Typecheck frontend
        run: npm run test
      - name: Build frontend
        run: npm run build
      - name: Check Tauri command layer
        run: cargo check -p autorepo-desktop
